[project]
name = "ai-security-paper-tracker"
version = "0.1.0"
description = "Track recent AI security research papers from arXiv"
requires-python = ">=3.9"
authors = []
dependencies = [
    "flask>=3.0",
]

[project.scripts]
ai-security-tracker = "main:main"
